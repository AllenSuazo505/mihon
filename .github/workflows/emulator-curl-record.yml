# Mihon Gold: record the page-curl animation on a CI emulator (manual only).
#
# Why this exists: the curl can only be judged by watching it move, and local
# runs cannot boot an emulator (no KVM in the build sandbox) while Appetize's
# free tier caps sessions at 3 minutes and resets the app every session. This
# workflow boots an Android emulator on a GitHub runner, seeds a local test
# manga (no source login, extension, or download needed), opens it in the
# reader, swipes forward and backward in portrait and landscape, and uploads
# the screen recording as an artifact.
#
# Triggered manually via workflow_dispatch only — never on push.
#
# NOTE: reactivecircus/android-emulator-runner executes its `script` input
# line by line (each line via its own `sh -c`), so heredocs, multi-line
# constructs, and shell variables do NOT work inside it. All real logic lives
# in the Python files written by the "Write emulator driver scripts" step;
# the emulator step itself only runs one self-contained command per line.

name: Record page curl on emulator

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  record-curl:
    name: Record page curl
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Ensure Android SDK platforms
        run: |
          ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          echo "--- installed platforms (diagnostic) ---"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | grep -i "platform" || true
          ls "$ANDROID_HOME/platforms" || true

      # CI-only: build against upstream's real compileSdk (37.2 = API 37 +
      # extension level 2), same as build-gold.yml. Local builds keep 36.
      - name: Restore upstream compileSdk for CI
        run: |
          sed -i 's/android-sdk-compile = "36"/android-sdk-compile = "37.2"/' gradle/mihon.versions.toml
          grep 'android-sdk-compile' gradle/mihon.versions.toml

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Write emulator driver scripts
        run: |
          python3 -m pip install --break-system-packages --quiet pillow
          mkdir -p emulator-scripts
          cat > emulator-scripts/gen_pages.py <<'PYEOF'
          import os, shutil, zipfile
          from PIL import Image, ImageDraw, ImageFont

          COLORS = [
              (220, 60, 60), (60, 120, 220), (60, 180, 90), (230, 170, 40),
              (150, 80, 200), (40, 180, 180), (230, 110, 160), (90, 90, 110),
          ]
          try:
              font_big = ImageFont.truetype(
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 420)
              font_small = ImageFont.truetype(
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 64)
          except Exception:
              font_big = ImageFont.load_default()
              font_small = font_big
          os.makedirs("curltest-pages", exist_ok=True)
          for i, color in enumerate(COLORS, start=1):
              img = Image.new("RGB", (1080, 1600), color)
              d = ImageDraw.Draw(img)
              # Vertical stripes + diagonal: curl deformation is visible
              # against straight lines, and the page number identifies
              # forward vs backward turns in the recording.
              for x in range(0, 1080, 90):
                  d.rectangle([x, 0, x + 8, 1600], fill=(255, 255, 255))
              d.line([(0, 1600), (1080, 0)], fill=(255, 255, 255), width=10)
              label = str(i)
              bbox = d.textbbox((0, 0), label, font=font_big)
              w, h = bbox[2] - bbox[0], bbox[3] - bbox[1]
              d.text(((1080 - w) / 2, (1600 - h) / 2 - 100), label,
                     fill=(255, 255, 255), font=font_big)
              d.text((60, 60), "PAGE %d / CURL TEST" % i,
                     fill=(255, 255, 255), font=font_small)
              img.save("curltest-pages/%02d.jpg" % i, quality=90)
          with zipfile.ZipFile("Chapter 1.cbz", "w") as z:
              for f in sorted(os.listdir("curltest-pages")):
                  z.write(os.path.join("curltest-pages", f), arcname=f)
          shutil.copy("curltest-pages/01.jpg", "cover.jpg")
          print("test manga ready: Chapter 1.cbz")
          PYEOF
          cat > emulator-scripts/seed.py <<'PYEOF'
          import glob, subprocess, sys

          PKG = "com.goldship.mihon.dev"

          def run(args, check=True):
              r = subprocess.run(args, capture_output=True, text=True)
              if r.stdout:
                  print(r.stdout, end="")
              if r.stderr:
                  print(r.stderr, end="", file=sys.stderr)
              if check and r.returncode != 0:
                  raise SystemExit("FAILED: %s (exit %d)" % (" ".join(args), r.returncode))
              return r

          # Install the debug APK (universal or x86_64 split).
          apks = sorted(glob.glob("app/build/outputs/apk/debug/*-universal-debug.apk"))
          apks += sorted(glob.glob("app/build/outputs/apk/debug/*-x86_64-debug.apk"))
          if not apks:
              raise SystemExit("no universal/x86_64 debug APK found")
          print("Installing", apks[0])
          run(["adb", "install", "-r", apks[0]])

          # Seed prefs + content BEFORE first launch. Debug builds allow
          # run-as, so we can write the app's own preferences and external
          # files directly:
          #  - __APP_STATE_onboarding_complete=true skips first-run onboarding
          #  - __APP_STATE_storage_dir points at the app's own internal
          #    files dir. External storage is deliberately avoided: on API 34
          #    the app's Android/data dir does not exist until first launch
          #    and run-as cannot create it (mkdir: Permission denied). The
          #    internal files dir is writable by run-as with no permission
          #    needed, and the Local source reads it via plain File IO.
          #  - Mihon's built-in Local source reads <storage>/local/<title>/
          prefs = (
              "<?xml version='1.0' encoding='utf-8' standalone='yes' ?>\n"
              "<map>\n"
              '    <boolean name="__APP_STATE_onboarding_complete" value="true" />\n'
              '    <string name="__APP_STATE_storage_dir">'
              "file:///data/data/com.goldship.mihon.dev/files"
              "</string>\n"
              "</map>\n"
          )
          with open("mihon_prefs.xml", "w") as f:
              f.write(prefs)
          run(["adb", "push", "Chapter 1.cbz", "/data/local/tmp/curltest.cbz"])
          run(["adb", "push", "cover.jpg", "/data/local/tmp/cover.jpg"])
          run(["adb", "push", "mihon_prefs.xml", "/data/local/tmp/mihon_prefs.xml"])
          run(["adb", "shell", "run-as", PKG, "mkdir", "-p",
               "/data/data/%s/shared_prefs" % PKG,
               "/data/data/%s/files/local/CurlTest" % PKG])
          run(["adb", "shell", "run-as", PKG, "cp",
               "/data/local/tmp/mihon_prefs.xml",
               "/data/data/%s/shared_prefs/%s_preferences.xml" % (PKG, PKG)])
          # NOTE: adb joins `shell` argv with spaces and the device shell
          # word-splits the result, so destinations containing spaces
          # (e.g. "Chapter 1.cbz") MUST be single-quoted here, or cp sees
          # the split pieces as extra operands ("cp: '1.cbz' not directory").
          run(["adb", "shell", "run-as", PKG, "cp",
               "/data/local/tmp/curltest.cbz",
               "'/data/data/%s/files/local/CurlTest/Chapter 1.cbz'" % PKG])
          run(["adb", "shell", "run-as", PKG, "cp",
               "/data/local/tmp/cover.jpg",
               "'/data/data/%s/files/local/CurlTest/cover.jpg'" % PKG])
          print("--- seeded files ---")
          run(["adb", "shell", "run-as", PKG, "ls", "-R",
               "/data/data/%s/files" % PKG])
          print("seed done")
          PYEOF
          cat > emulator-scripts/drive.py <<'PYEOF'
          import re, subprocess, sys, time, xml.etree.ElementTree as ET

          PKG = "com.goldship.mihon.dev"

          def shell(cmd):
              return subprocess.run(["adb", "shell", cmd],
                                    capture_output=True, text=True).stdout

          def shot(name):
              shell("screencap -p /sdcard/%s" % name)
              subprocess.run(["adb", "pull", "/sdcard/%s" % name, name],
                             capture_output=True)

          def dump():
              shell("uiautomator dump /sdcard/window_dump.xml")
              subprocess.run(["adb", "pull", "/sdcard/window_dump.xml",
                              "/tmp/window_dump.xml"], capture_output=True)
              with open("/tmp/window_dump.xml",
                        encoding="utf-8", errors="replace") as f:
                  return f.read()

          def tap_text(needle, timeout=60):
              deadline = time.time() + timeout
              while time.time() < deadline:
                  try:
                      root = ET.fromstring(dump())
                  except Exception:
                      time.sleep(1)
                      continue
                  for node in root.iter("node"):
                      text = node.get("text", "") or ""
                      desc = node.get("content-desc", "") or ""
                      if needle.lower() in text.lower() or \
                              (desc and needle.lower() in desc.lower()):
                          m = re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",
                                       node.get("bounds", ""))
                          if not m:
                              continue
                          x = (int(m.group(1)) + int(m.group(3))) // 2
                          y = (int(m.group(2)) + int(m.group(4))) // 2
                          print("TAP %r -> (%d,%d) text=%r"
                                % (needle, x, y, text), flush=True)
                          shell("input tap %d %d" % (x, y))
                          return True
                  time.sleep(1)
              print("TIMEOUT waiting for text: %s" % needle, flush=True)
              return False

          def size():
              m = re.search(r"(\d+)x(\d+)", shell("wm size"))
              return int(m.group(1)), int(m.group(2))

          def swipe(direction):
              # direction -1: swipe left; +1: swipe right. 500ms drag so
              # the curl tracks the finger, then the pager settles.
              w, h = size()
              y = h // 2
              if direction < 0:
                  x1, x2 = int(w * 0.8), int(w * 0.2)
              else:
                  x1, x2 = int(w * 0.2), int(w * 0.8)
              shell("input swipe %d %d %d %d 500" % (x1, y, x2, y))

          shell("monkey -p %s -c android.intent.category.LAUNCHER 1" % PKG)
          time.sleep(6)
          shot("step-1-launch.png")
          for needle in ["Browse", "Local source", "Curl Test", "Chapter 1"]:
              if not tap_text(needle, timeout=60):
                  shot("step-fail.png")
                  print("NAV FAILED at %s" % needle, flush=True)
                  sys.exit(1)
              time.sleep(3)
              shot("step-after-%s.png" % needle.replace(" ", "_"))
          time.sleep(2)
          shot("step-reader-open.png")

          # Record portrait swipes, then landscape swipes. The recording
          # runs 55s; the swipes below take ~40s total.
          rec = subprocess.Popen(["adb", "shell", "screenrecord",
                                  "--time-limit", "55", "/sdcard/curl.mp4"])
          time.sleep(1)
          for _ in range(4):
              swipe(-1)
              time.sleep(1.6)
          for _ in range(4):
              swipe(1)
              time.sleep(1.6)
          shell("settings put system accelerometer_rotation 0")
          shell("settings put system user_rotation 1")
          time.sleep(3)
          shot("step-landscape.png")
          for _ in range(4):
              swipe(-1)
              time.sleep(1.6)
          for _ in range(4):
              swipe(1)
              time.sleep(1.6)
          # Wait for screenrecord to hit its time limit and finalize.
          time.sleep(20)
          rec.wait(timeout=30)
          subprocess.run(["adb", "pull", "/sdcard/curl.mp4", "curl.mp4"],
                         check=False)
          print("recording done", flush=True)
          PYEOF
          python3 -c "import ast; [ast.parse(open('emulator-scripts/%s' % f).read()) for f in ['gen_pages.py', 'seed.py', 'drive.py']]; print('driver scripts parse OK')"

      - name: Drive emulator and record page curl
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          force-avd-creation: false
          disable-animations: false
          ram-size: 4096M
          disk-size: 6144M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put global window_animation_scale 1
            adb shell settings put global transition_animation_scale 1
            adb shell settings put global animator_duration_scale 1
            adb shell settings put system accelerometer_rotation 1
            python3 -u emulator-scripts/gen_pages.py
            python3 -u emulator-scripts/seed.py
            python3 -u emulator-scripts/drive.py
            ls -la curl.mp4 step-*.png

      - name: Upload curl recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curl-recording
          path: |
            curl.mp4
            step-*.png
