# Mihon Gold debug build (manual only).
#
# Builds a DEBUG APK of the Mihon Gold fork (package com.goldship.mihon,
# debug variant carries the .dev suffix) so it can be tested without any
# signing secrets. Triggered manually via workflow_dispatch only — never on
# push — so no surprise builds run.
#
# NOTE: this fork carries local-build workarounds (Aliyun mirror for Google
# Maven, gradle/vendor-repo/, compileSdk 36) that are harmless on GitHub
# runners and are intentionally left in place.

name: Build Mihon Gold (debug)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Ensure Android SDK platforms
        run: |
          ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          echo "--- installed platforms (diagnostic) ---"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | grep -i "platform" || true
          ls "$ANDROID_HOME/platforms" || true

      # CI-only: build against upstream's real compileSdk (37.2 = API 37 +
      # extension level 2). The fork's committed catalog says 36 because
      # the Android 37 platform is not downloadable inside the local
      # build sandbox; GitHub runners can install it, so restore it here.
      # Local builds keep compiling against 36.
      - name: Restore upstream compileSdk for CI
        run: |
          sed -i 's/android-sdk-compile = "36"/android-sdk-compile = "37.2"/' gradle/mihon.versions.toml
          grep 'android-sdk-compile' gradle/mihon.versions.toml

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: mihon-gold-debug
          path: app/build/outputs/apk/debug/
